# Members of the target CPU (NROM / mapper 0, 6502)
# RAM regions have no `file` attribute -> they occupy no bytes in the output.
# Only HEADER/PRG/CHR are written, in that order, so the file starts with the
# iNES magic and the size is exactly 16 + 32768 + 8192 = 40976.
MEMORY {
    HEADER:  start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:     start = $8000, size = $8000, type = ro, file = %O, fill = yes;
    CHR:     start = $0000, size = $2000, type = ro, file = %O, fill = yes;
    ZP:      start = $0000, size = $0100, type = rw, file = "";
    RAMVARS: start = $0300, size = $0100, type = rw, file = "";
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    RAMVARS:  load = RAMVARS, type = rw, define = yes;
    HEADER:   load = HEADER,  type = ro;
    CODE:     load = PRG,     type = ro,  start = $8000;
    RODATA:   load = PRG,     type = ro,  start = $A000;
    VECTORS:  load = PRG,     type = ro,  start = $FFFA;
    CHARS:    load = CHR,     type = ro;
}
